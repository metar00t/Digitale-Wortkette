List of Connected Players in Lobby
---
tags:
  - Lobby
produces:
  - application/json
parameters:
  - in: path
    name: lobbyID
    type: integer
    required: true
    description: Lobby-ID of the Lobby
responses:
  200:
    description: Playerlist found
    schema:
      type: array
      items:
        type: object
        properties:
          lobbyID:
            type: integer
            description: LobbyID
          username:
            type: string
            default: John Doe
            description: username of Player
          isPlayerReady:
            type: boolean
            default: false
            description: Status of Player

  204:
    description: No Player in this Lobby