Current Lobby with Playerlist
---
tags:
  - Lobby
produces:
  - application/json
parameters:
  - in: path
    name: lobbyID
    type: integer
    required: true
    description: Lobby-ID of the Lobby
responses:
  200:
    description: Playerlist found
    schema:
      type: array
      items:
        type: object
        properties:
          lobbyID:
            type: integer
            default: 1
            description: LobbyID
          hostID:
            type: integer
            default: 0
            description: HostID
          userID:
            type: integer
            default: 2
            description: Players userID
          username:
            type: string
            default: John Doe
            description: username of Player
          isPlayerReady:
            type: boolean
            default: false
            description: Status of Player

  204:
    description: No Player in this Lobby