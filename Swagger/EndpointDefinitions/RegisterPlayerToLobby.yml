Join Lobby
---
tags:
  - Player
parameters:
  - in: formData
    name: nickname
    type: string
    required: true
    description: Nickname of Player
  - in: formData
    name: isPlayerReady
    type: boolean
    required: true
    default: false
    description: Status of Player
  - in: path
    name: lobbyID
    type: integer
    required: true
    description: The LobbyID from the Lobby the Player wants to join
responses:
  200:
    description: Player joined successfully
    schema:
      type: object
      properties:
        message:
          type: string
          default: Beitritt erfolgreich